<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scalping Terminal TURBO — Max Profit</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{--bg:#05080c;--panel:#0a0f14;--panel2:#111820;--border:#1a2330;--text:#e8edf3;--dim:#5a6a7a;--green:#00ff88;--red:#ff3366;--blue:#00ccff;--orange:#ffaa00;--purple:#cc66ff;--gold:#ffdd44;--cyan:#00e5e5}
  body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;height:100vh;display:flex;flex-direction:column;overflow:hidden}

  .header{display:flex;align-items:center;gap:14px;padding:8px 16px;background:var(--panel);border-bottom:1px solid var(--border);flex-shrink:0}
  .logo{font-weight:900;font-size:14px;background:linear-gradient(90deg,var(--gold),var(--orange));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
  .asset-select{background:var(--bg);border:1px solid var(--border);color:var(--text);padding:4px 10px;border-radius:5px;font-size:12px;cursor:pointer}
  .badge{font-size:10px;padding:2px 8px;border-radius:12px;font-weight:700;border:1px solid transparent}
  .badge-live{background:rgba(0,255,136,0.1);color:var(--green);border-color:rgba(0,255,136,0.3)}
  .badge-warn{background:rgba(255,170,0,0.1);color:var(--orange);border-color:rgba(255,170,0,0.3)}
  .badge-turbo{background:rgba(204,102,255,0.15);color:var(--purple);border-color:rgba(204,102,255,0.4)}
  .price-box{text-align:right;min-width:130px}
  .price-main{font-size:20px;font-weight:800;font-family:'SF Mono',monospace}
  .price-sub{font-size:10px;color:var(--dim)}
  .pnl-box{text-align:right;min-width:100px}
  .pnl-label{font-size:9px;color:var(--dim);text-transform:uppercase}
  .pnl-value{font-size:16px;font-weight:800}
  .stats-mini{display:flex;gap:12px;font-size:11px;color:var(--dim)}
  .stats-mini b{color:var(--text);margin-left:3px}

  .main{display:flex;flex:1;overflow:hidden}
  .chart-area{flex:1;display:flex;flex-direction:column;position:relative}
  .toolbar{display:flex;gap:5px;padding:5px 10px;background:var(--panel);border-bottom:1px solid var(--border);align-items:center}
  .toolbar button{background:var(--bg);border:1px solid var(--border);color:var(--dim);padding:3px 10px;border-radius:4px;font-size:11px;cursor:pointer;transition:.15s;font-weight:600}
  .toolbar button:hover{border-color:var(--blue);color:var(--text)}
  .toolbar button.active{background:var(--blue);color:#000;border-color:var(--blue)}
  .toolbar .sep{width:1px;height:16px;background:var(--border);margin:0 3px}
  .chart-wrap{flex:1;position:relative;overflow:hidden}
  canvas{display:block;width:100%;height:100%}

  .side-panel{width:320px;background:var(--panel);border-left:1px solid var(--border);display:flex;flex-direction:column;overflow-y:auto}
  .panel-section{padding:10px;border-bottom:1px solid var(--border)}
  .panel-title{font-size:10px;font-weight:800;text-transform:uppercase;color:var(--dim);margin-bottom:8px;letter-spacing:0.5px}
  .row{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;font-size:11px}
  .row label{color:var(--dim);font-size:10px}
  .row input,.row select{background:var(--bg);border:1px solid var(--border);color:var(--text);padding:3px 6px;border-radius:4px;font-size:11px;width:90px}
  .row input[type="checkbox"]{width:auto;transform:scale(1.1)}
  .btn{width:100%;padding:9px;border:none;border-radius:5px;font-weight:800;font-size:12px;cursor:pointer;margin-top:6px;transition:.2s}
  .btn-turbo{background:linear-gradient(135deg,var(--purple),var(--blue));color:#fff}
  .btn-turbo:hover{filter:brightness(1.2);transform:translateY(-1px)}
  .btn-stop{background:var(--red);color:#fff}
  .btn-stop:hover{filter:brightness(1.2)}

  .strategy-grid{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-bottom:6px}
  .strat-item{background:var(--bg);border:1px solid var(--border);border-radius:4px;padding:5px;font-size:10px;text-align:center}
  .strat-item.on{background:rgba(0,255,136,0.08);border-color:rgba(0,255,136,0.3);color:var(--green)}
  .strat-item.off{background:rgba(255,51,102,0.08);border-color:rgba(255,51,102,0.3);color:var(--red)}

  .live-pnl{background:var(--bg);border:1px solid var(--border);border-radius:5px;padding:8px;text-align:center;margin-bottom:8px}
  .live-pnl .val{font-size:22px;font-weight:800}
  .live-pnl .lbl{font-size:9px;color:var(--dim);text-transform:uppercase}

  .log-box{background:var(--bg);border:1px solid var(--border);border-radius:4px;padding:6px;height:130px;overflow-y:auto;font-size:10px;font-family:'SF Mono',monospace;line-height:1.4}
  .log-entry{margin-bottom:2px}
  .log-time{color:var(--dim);margin-right:4px;font-size:9px}
  .log-g{color:var(--green)} .log-r{color:var(--red)} .log-b{color:var(--blue)} .log-o{color:var(--orange)} .log-p{color:var(--purple)}

  .bottom-panel{height:180px;background:var(--panel);border-top:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0}
  .tab-bar{display:flex;background:var(--bg);border-bottom:1px solid var(--border)}
  .tab{padding:6px 14px;font-size:11px;cursor:pointer;border-bottom:2px solid transparent;color:var(--dim);font-weight:600}
  .tab.active{color:var(--text);border-bottom-color:var(--blue);background:var(--panel)}
  .tab-content{flex:1;overflow:auto;padding:10px}
  .hidden{display:none!important}

  .stats-row{display:flex;gap:8px}
  .stat-card{flex:1;background:var(--bg);border:1px solid var(--border);border-radius:5px;padding:8px;text-align:center}
  .stat-value{font-size:16px;font-weight:800}
  .stat-label{font-size:9px;color:var(--dim);text-transform:uppercase}

  .trades-table{width:100%;border-collapse:collapse;font-size:11px}
  .trades-table th{text-align:left;padding:5px 6px;color:var(--dim);border-bottom:1px solid var(--border);font-size:10px}
  .trades-table td{padding:5px 6px;border-bottom:1px solid var(--border)}

  #tooltip{position:absolute;background:rgba(10,15,20,0.95);border:1px solid var(--border);border-radius:5px;padding:8px;font-size:11px;pointer-events:none;display:none;z-index:100;box-shadow:0 8px 24px rgba(0,0,0,0.5)}
  .tt-row{display:flex;justify-content:space-between;gap:20px;margin-bottom:1px}

  @keyframes flashG{0%{box-shadow:inset 0 0 0 0 transparent}50%{box-shadow:inset 0 0 60px rgba(0,255,136,0.2)}100%{box-shadow:inset 0 0 0 0 transparent}}
  @keyframes flashR{0%{box-shadow:inset 0 0 0 0 transparent}50%{box-shadow:inset 0 0 60px rgba(255,51,102,0.2)}100%{box-shadow:inset 0 0 0 0 transparent}}
  .flash-g{animation:flashG 0.6s ease}
  .flash-r{animation:flashR 0.6s ease}

  .pos-bar{position:absolute;bottom:0;left:0;right:0;height:3px;background:transparent;z-index:10}
  .pos-bar.in{box-shadow:0 -2px 8px var(--green);background:var(--green)}
  .pos-bar.out{box-shadow:0 -2px 8px var(--red);background:var(--red)}
</style>
<base target="_blank">
</head>
<body>

<div class="header">
  <div class="logo">⚡ TURBO SCALPER</div>
  <select class="asset-select" id="assetSelect">
    <option value="PAXGUSDT">🥇 PAXG/USDT</option>
    <option value="ETHUSDT">🥈 ETH/USDT</option>
    <option value="XRPUSDT">⚡ XRP/USDT</option>

  </select>
  <span class="badge badge-live" id="wsBadge">● WS</span>

  <div class="stats-mini">
    <span>Сделок:<b id="statTrades">0</b></span>
    <span>Win:<b id="statWinRate">—</b></span>
    <span>Streak:<b id="statStreak">0</b></span>
  </div>
  <div class="price-box">
    <div class="price-main" id="priceMain">—</div>
    <div class="price-sub" id="priceSub">live</div>
  </div>
  <div class="pnl-box">
    <div class="pnl-label">P&L День</div>
    <div class="pnl-value" id="pnlToday">$0</div>

</div>

<div class="main">
  <div class="chart-area">
    <div class="toolbar">
      <button id="tf1m">1м</button>
      <button id="tf5m" class="active">5м</button>
      <button id="tf15m">15м</button>
      <div class="sep"></div>
      <button id="tEMA" class="active">EMA</button>
      <button id="tVWAP">VWAP</button>
      <button id="tSR">S/R</button>
      <button id="tDelta">Δ</button>
      <div class="sep"></div>
      <span>Бот: <b id="botStatus" style="color:var(--red)">OFF</b></span>
    </div>
    <div class="chart-wrap" id="chartWrap">
      <canvas id="chartCanvas"></canvas>
      <div id="tooltip"></div>
      <div class="pos-bar" id="posBar"></div>
    </div>
  </div>

  <div class="side-panel">
    <div class="panel-section">
      <div class="panel-title">Turbo Settings</div>
      <div class="row"><label>Режим</label>
        <select id="botMode">
          <option value="turbo" selected>🔥 TURBO (макс прибыль)</option>
          <option value="fast">⚡ FAST</option>

        </select>
      </div>
      <div class="row"><label>Риск (%)</label><input type="number" id="riskPct" value="1.5" step="0.1"></div>
      <div class="row"><label>Макс сделок</label><input type="number" id="maxDay" value="25" min="1"></div>
      <div class="row"><label>SL × ATR</label><input type="number" id="slMult" value="0.6" step="0.1"></div>
      <div class="row"><label>TP × ATR</label><input type="number" id="tpMult" value="1.8" step="0.1"></div>
      <div class="row"><label>Трейлинг</label><input type="checkbox" id="useTrail" checked></div>

    <div class="panel-section">
      <div class="panel-title">Стратегии</div>
      <div class="strategy-grid" id="stratGrid">
        <div class="strat-item on" id="sMomentum">Momentum</div>
        <div class="strat-item on" id="sVWAP">VWAP</div>
        <div class="strat-item on" id="sBreak">Break</div>
        <div class="strat-item on" id="sPullback">Pullback</div>
      </div>
      <div class="live-pnl" id="livePnLBox" style="display:none">
        <div class="lbl">Текущая P&L</div>

    <div class="panel-section">

</div>

<div class="bottom-panel">
  <div class="tab-bar">
    <div class="tab active" data-tab="stats">📈 Стат</div>
    <div class="tab" data-tab="trades">📊 Сделки</div>
    <div class="tab" data-tab="calendar">📅 Кал</div>
  </div>
  <div class="tab-content" id="tabStats">
    <div class="stats-row">
      <div class="stat-card"><div class="stat-label">Win Rate</div><div class="stat-value" id="stWin">—</div></div>
      <div class="stat-card"><div class="stat-label">Profit Factor</div><div class="stat-value" id="stPF">—</div></div>
      <div class="stat-card"><div class="stat-label">Avg Trade</div><div class="stat-value" id="stAvg">—</div></div>
      <div class="stat-card"><div class="stat-label">Всего</div><div class="stat-value" id="stTotal">—</div></div>
      <div class="stat-card"><div class="stat-label">Лучшая</div><div class="stat-value" id="stBest">—</div></div>
      <div class="stat-card"><div class="stat-label">Худшая</div><div class="stat-value" id="stWorst">—</div></div>
    </div>
  </div>
  <div class="tab-content hidden" id="tabTrades">
    <table class="trades-table">
      <thead><tr><th>Время</th><th>Страт</th><th>Тип</th><th>Вход</th><th>Выход</th><th>P&L</th><th>Причина</th></tr></thead>
      <tbody id="tradesBody"></tbody>
    </table>
  </div>
  <div class="tab-content hidden" id="tabCalendar">
    <div class="calendar-grid" id="calendarGrid" style="display:grid;grid-template-columns:repeat(7,1fr);gap:3px"></div>
  </div>
</div>

<script>

/* ===================== STATE ===================== */
const S = {
  asset:'PAXGUSDT', viewTF:'5m',
  data1m:[], data5m:[], data15m:[], data1h:[],
  currentPrice:0, bestBid:0, bestAsk:0,
  ws:null, wsConnected:false, reconnectDelay:1000,
  botActive:false, balance:10000,
  position:null,
  cooldown:0, tradesToday:0, dayTrades:[], tradeMarkers:[],
  streak:0, // consecutive wins
  lastScan:0, scanCount:0,
  ema9_1m:[], ema21_1m:[], vwap1m:[], delta1m:[],
  ema9_5m:[], ema21_5m:[], ema50_5m:[], vwap5m:[], rsi5m:[], atr5m:[], adx5m:[], bb5m:[], delta5m:[], range5m:[],
  ema9_15m:[], ema21_15m:[], ema50_15m:[],
  ema50_1h:[], sr5m:[],
  showEMA:true, showVWAP:false, showSR:true, showDelta:false,
  hoverIdx:-1,
};

const ASSETS={PAXGUSDT:{name:'PAXG/USDT',tick:0.01},ETHUSDT:{name:'ETH/USDT',tick:0.01},XRPUSDT:{name:'XRP/USDT',tick:0.0001},SOLUSDT:{name:'SOL/USDT',tick:0.01}};

/* ===================== STORAGE ===================== */
function loadStore(){
  const d=localStorage.getItem('scalpTurbo_v1');
  if(d){ const j=JSON.parse(d); S.dayTrades=j.dayTrades||[]; S.balance=j.balance||10000; S.tradeMarkers=j.tradeMarkers||[]; }
}
function saveStore(){
  localStorage.setItem('scalpTurbo_v1', JSON.stringify({
    dayTrades:S.dayTrades, balance:S.balance, tradeMarkers:S.tradeMarkers, lastSave:Date.now()
  }));
}
loadStore();

/* ===================== AUDIO ===================== */
const AudioCtx=window.AudioContext||window.webkitAudioContext;
let audioCtx=null;
function initAudio(){ if(!audioCtx) audioCtx=new AudioCtx(); }
function beep(freq,dur,type,vol){
  if(!document.getElementById('useSound').checked) return;
  initAudio(); const o=audioCtx.createOscillator(),g=audioCtx.createGain();
  o.type=type; o.frequency.value=freq; g.gain.value=vol;
  o.connect(g); g.connect(audioCtx.destination); o.start();
  g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+dur); o.stop(audioCtx.currentTime+dur);
}
function soundEntry(side){ beep(side==='LONG'?1400:700,0.12,'square',0.1); setTimeout(()=>beep(side==='LONG'?1800:600,0.18,'sine',0.08),100); }
function soundExit(pnl){ beep(pnl>=0?2000:350,0.3,pnl>=0?'sine':'sawtooth',0.1); }

/* ===================== LOGGER ===================== */
function log(msg,type){
  const box=document.getElementById('logBox'); if(!box) return;
  const t=new Date().toLocaleTimeString('ru-RU',{hour12:false, hour:'2-digit', minute:'2-digit', second:'2-digit'});
  const div=document.createElement('div'); div.className='log-entry';
  const cls=type==='g'?'log-g':type==='r'?'log-r':type==='b'?'log-b':type==='o'?'log-o':type==='p'?'log-p':'';
  div.innerHTML='<span class="log-time">'+t+'</span><span class="'+cls+'">'+msg+'</span>';
  box.appendChild(div); box.scrollTop=box.scrollHeight;
  if(box.children.length>200) box.removeChild(box.firstChild);
}

/* ===================== API ===================== */
async function fetchKlines(sym,intv,limit){
  const res=await fetch('https://api.binance.com/api/v3/klines?symbol='+sym+'&interval='+intv+'&limit='+limit);
  if(!res.ok) throw new Error('HTTP '+res.status);
  const j=await res.json();
  return j.map(d=>({time:d[0],open:+d[1],high:+d[2],low:+d[3],close:+d[4],volume:+d[5]}));
}

/* ===================== INDICATORS ===================== */
function ema(data,period){
  const k=2/(period+1), out=[]; let e=data[0]?data[0].close:0;
  for(let i=0;i<data.length;i++){ if(i===0)e=data[i].close; else e=data[i].close*k+e*(1-k); out.push(e);}
  return out;
}
function calcVWAP(data){
  let cTP=0,cV=0;
  return data.map(d=>{ const tp=(d.high+d.low+d.close)/3; cTP+=tp*d.volume; cV+=d.volume; return cTP/cV; });
}
function calcRSI(data,p){
  p=p||14; const out=new Array(data.length).fill(50); let g=0,l=0;
  for(let i=1;i<=p;i++){ const ch=data[i].close-data[i-1].close; if(ch>0)g+=ch; else l-=ch; }
  let aG=g/p,aL=l/p;
  for(let i=p;i<data.length;i++){
    const ch=data[i].close-data[i-1].close; const cg=ch>0?ch:0,cl=ch<0?-ch:0;
    aG=(aG*(p-1)+cg)/p; aL=(aL*(p-1)+cl)/p;
    const rs=aL===0?100:aG/aL; out[i]=100-(100/(1+rs));
  }
  return out;
}
function calcATR(data,p){
  p=p||14; const out=[]; let s=0;
  for(let i=0;i<data.length;i++){
    if(i===0){out.push(data[i].high-data[i].low);continue;}
    const tr=Math.max(data[i].high-data[i].low, Math.abs(data[i].high-data[i-1].close), Math.abs(data[i].low-data[i-1].close));
    if(i<p){s+=tr;out.push(s/i);}else if(i===p){s+=tr;out.push(s/p);}else{s=s*(p-1)/p+tr;out.push(s/p);}
  }
  return out;
}
function calcADX(data,p){
  p=p||14; const tr=[],pDM=[],mDM=[],out=[];
  for(let i=1;i<data.length;i++){
    const h=data[i].high,l=data[i].low,pc=data[i-1].close;
    tr.push(Math.max(h-l,Math.abs(h-pc),Math.abs(l-pc)));
    pDM.push(h-data[i-1].high>data[i-1].low-l?Math.max(h-data[i-1].high,0):0);
    mDM.push(data[i-1].low-l>h-data[i-1].high?Math.max(data[i-1].low-l,0):0);
  }
  if(tr.length<p) return new Array(data.length).fill(20);
  let aTR=tr.slice(0,p).reduce((a,b)=>a+b,0)/p;
  let aPD=pDM.slice(0,p).reduce((a,b)=>a+b,0)/p;
  let aMD=mDM.slice(0,p).reduce((a,b)=>a+b,0)/p;
  let dx=100*Math.abs(aPD-aMD)/(aPD+aMD||1); let adx=dx;
  for(let i=0;i<p;i++) out.push(20); out.push(adx);
  for(let i=p;i<tr.length;i++){
    aTR=(aTR*(p-1)+tr[i])/p; aPD=(aPD*(p-1)+pDM[i])/p; aMD=(aMD*(p-1)+mDM[i])/p;
    dx=100*Math.abs(aPD-aMD)/(aPD+aMD||1); adx=(adx*(p-1)+dx)/p; out.push(adx);
  }
  return out;
}
function calcBB(data,p,m){
  p=p||20; m=m||2; const out=[];
  for(let i=0;i<data.length;i++){
    if(i<p-1){out.push({mid:0,up:0,lo:0,w:0});continue;}
    const sl=data.slice(i-p+1,i+1); const mean=sl.reduce((s,d)=>s+d.close,0)/p;
    const std=Math.sqrt(sl.reduce((s,d)=>s+Math.pow(d.close-mean,2),0)/p);
    out.push({mid:mean,up:mean+m*std,lo:mean-m*std,w:2*m*std/mean});
  }
  return out;
}
function calcDelta(data){
  return data.map(d=>{ const r=(d.high-d.low)||0.0001; const br=(d.close-d.low)/r; return d.volume*br-d.volume*(1-br); });
}
function calcRange(data,period){
  period=period||20; const out=[];
  for(let i=0;i<data.length;i++){
    if(i<period-1){out.push({h:0,l:0,w:0});continue;}
    const sl=data.slice(i-period+1,i+1);
    const h=Math.max(...sl.map(d=>d.high)); const l=Math.min(...sl.map(d=>d.low));
    out.push({h:h,l:l,w:(h-l)/data[i].close});
  }
  return out;
}
function calcSR(data){
  const lv=[]; const n=data.length; if(n<20) return lv;
  for(let i=5;i<n-5;i++){
    const sl=data.slice(i-5,i+6); const mx=Math.max(...sl.map(d=>d.high)),mn=Math.min(...sl.map(d=>d.low));
    if(data[i].high===mx) lv.push({p:data[i].high,t:'R'});
    if(data[i].low===mn) lv.push({p:data[i].low,t:'S'});
  }
  const cl=[];
  lv.forEach(l=>{ const ex=cl.find(c=>Math.abs(c.p-l.p)/c.p<0.001); if(ex) ex.s++; else cl.push({p:l.p,t:l.t,s:1}); });
  return cl.filter(l=>l.s>=2).sort((a,b)=>b.s-a.s).slice(0,8);
}

function recalcAll(){
  if(S.data1m.length>20){ S.ema9_1m=ema(S.data1m,9); S.ema21_1m=ema(S.data1m,21); S.vwap1m=calcVWAP(S.data1m); S.delta1m=calcDelta(S.data1m); }
  if(S.data5m.length>50){
    S.ema9_5m=ema(S.data5m,9); S.ema21_5m=ema(S.data5m,21); S.ema50_5m=ema(S.data5m,50);
    S.vwap5m=calcVWAP(S.data5m); S.rsi5m=calcRSI(S.data5m); S.atr5m=calcATR(S.data5m);
    S.adx5m=calcADX(S.data5m); S.bb5m=calcBB(S.data5m); S.delta5m=calcDelta(S.data5m); S.range5m=calcRange(S.data5m,20);
    S.sr5m=calcSR(S.data5m);
  }
  if(S.data15m.length>20){ S.ema9_15m=ema(S.data15m,9); S.ema21_15m=ema(S.data15m,21); S.ema50_15m=ema(S.data15m,50); }
  if(S.data1h.length>20) S.ema50_1h=ema(S.data1h,50);
}

/* ===================== WEBSOCKET ===================== */
function connectWS(){
  if(S.ws) return;
  const s=S.asset.toLowerCase();
  const streams=s+'@kline_1m/'+s+'@kline_5m/'+s+'@kline_15m/'+s+'@trade/'+s+'@bookTicker';
  S.ws=new WebSocket('wss://stream.binance.com:9443/stream?streams='+streams);
  S.ws.onopen=()=>{
    S.wsConnected=true; S.reconnectDelay=1000;
    document.getElementById('wsBadge').textContent='● WS';
    document.getElementById('wsBadge').className='badge badge-live';
    log('WS подключен','b');
  };
  S.ws.onmessage=(e)=>{
    try{ const msg=JSON.parse(e.data); handleWS(msg.data); }catch(err){}
  };
  S.ws.onclose=()=>{
    S.ws=null; S.wsConnected=false;
    document.getElementById('wsBadge').textContent='● OFF';
    document.getElementById('wsBadge').className='badge badge-warn';
    S.reconnectDelay=Math.min(S.reconnectDelay*2,30000);
    setTimeout(connectWS,S.reconnectDelay);
  };
  S.ws.onerror=()=>{ if(S.ws) S.ws.close(); };
}

function handleWS(d){
  if(!d) return;
  if(d.e==='trade'){
    S.currentPrice=+d.p;
    updateUI();
    if(S.botActive) botLogic();
    requestAnimationFrame(drawChart);
  }
  else if(d.e==='bookTicker'){
    S.bestBid=+d.b; S.bestAsk=+d.a;
    const sp=(S.bestAsk-S.bestBid)/S.currentPrice*100;
    document.getElementById('priceSub').textContent='спред '+(isFinite(sp)?sp.toFixed(3):'—')+'%';
  }
  else if(d.e==='kline'){
    const k=d.k; const c={time:k.t,open:+k.o,high:+k.h,low:+k.l,close:+k.c,volume:+k.v};
    const arr=k.i==='1m'?S.data1m:k.i==='5m'?S.data5m:k.i==='15m'?S.data15m:null;
    if(!arr) return;
    if(arr.length>0&&arr[arr.length-1].time===k.t) arr[arr.length-1]=c;
    else{ arr.push(c); if(arr.length>400) arr.shift(); }
    if(k.x){ recalcAll(); if(S.botActive) botLogic(); }
  }
}

function genDemoAll(){
  const base=S.currentPrice||2600;
  ['1m','5m','15m','1h'].forEach(tf=>{
    const ms=tf==='1m'?60000:tf==='5m'?300000:tf==='15m'?900000:3600000;
    const cnt=tf==='1m'?300:tf==='5m'?300:tf==='15m'?150:100;
    const arr=[]; let p=base; let t=Date.now()-cnt*ms;
    for(let i=0;i<cnt;i++){
      const ch=(Math.random()-0.5)*p*0.003; const o=p; const c=p+ch;
      const h=Math.max(o,c)+Math.random()*p*0.001; const l=Math.min(o,c)-Math.random()*p*0.001;
      arr.push({time:t,open:o,high:h,low:l,close:c,volume:10+Math.random()*100});
      p=c; t+=ms;
    }
    if(tf==='1m') S.data1m=arr; else if(tf==='5m') S.data5m=arr; else if(tf==='15m') S.data15m=arr; else S.data1h=arr;
  });
  S.currentPrice=S.data1m[S.data1m.length-1].close;
  recalcAll();
}

/* ===================== BOT LOGIC ===================== */
function botLogic(){
  if(!S.botActive) return;
  const price=S.currentPrice;
  if(!price||S.data5m.length<55||S.data1m.length<20) return;

  // Manage position FIRST (fast exit is priority)
  if(S.position){ managePosition(price); return; }

  if(S.cooldown>0){ S.cooldown--; return; }
  if(S.tradesToday>=+document.getElementById('maxDay').value) return;

  const mode=document.getElementById('botMode').value;

  // Try strategies in order of speed
  let signal=null;

  // 1. MOMENTUM — fastest, highest win rate in turbo
  if(document.getElementById('sMomentum').classList.contains('on')){
    signal=momentumStrategy();
    if(signal){ signal.strategy='MOMENTUM'; }
  }

  // 2. VWAP BOUNCE
  if(!signal&&document.getElementById('sVWAP').classList.contains('on')){
    signal=vwapStrategy();
    if(signal){ signal.strategy='VWAP'; }
  }

  // 3. RANGE BREAK
  if(!signal&&document.getElementById('sBreak').classList.contains('on')){
    signal=breakStrategy();
    if(signal){ signal.strategy='BREAK'; }
  }

  // 4. PULLBACK
  if(!signal&&document.getElementById('sPullback').classList.contains('on')){
    signal=pullbackStrategy();
    if(signal){ signal.strategy='PULLBACK'; }
  }

  if(!signal) return;

  // In TURBO mode — minimal filters, just basic checks
  if(mode==='turbo'){
    if(!turboFilter(signal)) return;
  }else{
    if(!standardFilter(signal)) return;
  }

  executeEntry(signal);
}

/* ----- STRATEGIES ----- */
function momentumStrategy(){
  // Enter on 1m candle break of previous high/low with volume
  const i1=S.data1m.length-1;
  const i2=i1-1;
  if(i2<0) return null;
  const c1=S.data1m[i1], c2=S.data1m[i2];
  const price=S.currentPrice;
  const atr5=S.atr5m[S.atr5m.length-1]||0;

  // Need strong 1m candle
  const body=Math.abs(c1.close-c1.open);
  const range=c1.high-c1.low;
  if(range===0) return null;
  const bodyRatio=body/range;
  if(bodyRatio<0.6) return null; // need decisive candle

  // Break of previous high/low
  const breakUp=c1.close>c2.high&&c1.volume>c2.volume*1.2;
  const breakDown=c1.close<c2.low&&c1.volume>c2.volume*1.2;

  // 5m trend alignment (loose)
  const i5=S.data5m.length-1;
  const e9=S.ema9_5m[i5], e21=S.ema21_5m[i5];
  const trendUp=e9>e21;
  const trendDown=e9<e21;

  if(breakUp&&trendUp) return {side:'LONG',entry:price,sl:price-atr5*0.5,tp:price+atr5*1.8};
  if(breakDown&&trendDown) return {side:'SHORT',entry:price,sl:price+atr5*0.5,tp:price-atr5*1.8};
  return null;
}

function vwapStrategy(){
  const i5=S.data5m.length-1;
  const price=S.currentPrice;
  const vwap=S.vwap5m[i5];
  const atr5=S.atr5m[i5]||0;
  if(!vwap) return null;

  const e9=S.ema9_5m[i5], e21=S.ema21_5m[i5];
  const trendUp=e9>e21;
  const trendDown=e9<e21;

  // Price touched VWAP and bounced
  const prev=S.data5m[i5-1];
  if(!prev) return null;

  const touchedVWAP=prev.low<=vwap&&prev.high>=vwap;
  const bounceUp=trendUp&&price>vwap&&price>prev.close;
  const bounceDown=trendDown&&price<vwap&&price<prev.close;

  if(touchedVWAP&&bounceUp) return {side:'LONG',entry:price,sl:price-atr5*0.6,tp:price+atr5*1.6};
  if(touchedVWAP&&bounceDown) return {side:'SHORT',entry:price,sl:price+atr5*0.6,tp:price-atr5*1.6};
  return null;
}

function breakStrategy(){
  const i5=S.data5m.length-1;
  const rng=S.range5m[i5];
  const price=S.currentPrice;
  const atr5=S.atr5m[i5]||0;
  if(!rng||rng.w<0.003) return null; // need some range

  const vol=S.data5m[i5].volume;
  const avgVol=S.data5m.slice(i5-20,i5).reduce((s,d)=>s+d.volume,0)/20;
  if(vol<avgVol*1.3) return null;

  const breakUp=price>rng.h;
  const breakDown=price<rng.l;

  if(breakUp) return {side:'LONG',entry:price,sl:price-atr5*0.5,tp:price+atr5*2.0};
  if(breakDown) return {side:'SHORT',entry:price,sl:price+atr5*0.5,tp:price-atr5*2.0};
  return null;
}

function pullbackStrategy(){
  const i5=S.data5m.length-1;
  const price=S.currentPrice;
  const e9=S.ema9_5m[i5], e21=S.ema21_5m[i5], e50=S.ema50_5m[i5];
  const atr5=S.atr5m[i5]||0;

  const up=e9>e21&&e21>e50;
  const down=e9<e21&&e21<e50;
  if(!up&&!down) return null;

  // Price near EMA9 (fast pullback)
  const nearE9=Math.abs(price-e9)/price<0.001;
  if(!nearE9) return null;

  // 1m confirmation
  const i1=S.data1m.length-1;
  const c1=S.data1m[i1], p1=S.data1m[i1-1];
  const bullRev=c1.close>c1.open&&c1.low<p1.low;
  const bearRev=c1.close<c1.open&&c1.high>p1.high;

  if(up&&bullRev) return {side:'LONG',entry:price,sl:price-atr5*0.5,tp:price+atr5*1.5};
  if(down&&bearRev) return {side:'SHORT',entry:price,sl:price+atr5*0.5,tp:price-atr5*1.5};
  return null;
}

/* ----- FILTERS ----- */
function turboFilter(sig){
  const i5=S.data5m.length-1;
  const price=S.currentPrice;
  const spread=(S.bestAsk-S.bestBid)/price;
  if(isFinite(spread)&&spread>0.0015) return false; // only wide spread blocks
  const adx=S.adx5m[i5]||20;
  if(adx<15) return false; // need some momentum
  return true;
}

function standardFilter(sig){
  const i5=S.data5m.length-1;
  const price=S.currentPrice;
  const spread=(S.bestAsk-S.bestBid)/price;
  if(isFinite(spread)&&spread>0.001) return false;
  const adx=S.adx5m[i5]||20;
  if(adx<18) return false;
  // MTF check
  if(S.data15m.length>20&&S.ema9_15m.length>20){
    const i15=S.data15m.length-1;
    if(sig.side==='LONG'&&!(S.ema9_15m[i15]>S.ema21_15m[i15])) return false;
    if(sig.side==='SHORT'&&!(S.ema9_15m[i15]<S.ema21_15m[i15])) return false;
  }
  return true;
}

/* ----- ENTRY ----- */
function executeEntry(sig){
  const price=S.currentPrice;
  const mode=document.getElementById('botMode').value;
  const riskPct=+document.getElementById('riskPct').value/100;
  const slMult=+document.getElementById('slMult').value;
  const tpMult=+document.getElementById('tpMult').value;
  const atr5=S.atr5m[S.atr5m.length-1]||0;

  // Recalculate SL/TP based on settings
  const sl=sig.side==='LONG'?price-atr5*slMult:price+atr5*slMult;
  const tp=sig.side==='LONG'?price+atr5*tpMult:price-atr5*tpMult;

  const baseRisk=S.balance*riskPct;
  const slDist=Math.abs(price-sl);
  const size=Math.max(1, Math.floor(baseRisk/slDist));

  S.position={
    side:sig.side, entry:price, sl:sl, tp:tp, size:size,
    openTime:Date.now(), strategy:sig.strategy,
    partial1:false, partial2:false, trailActive:false,
    highest:price, lowest:price,
    entryBar:S.data5m.length-1
  };
  S.tradesToday++;

  S.tradeMarkers.push({
    index:S.data5m.length-1, price:price, side:sig.side, type:'entry',
    strategy:sig.strategy, time:Date.now()
  });

  log('🚀 '+sig.side+' @ '+price.toFixed(2)+' | '+sig.strategy+' | SL '+sl.toFixed(2)+' | TP '+tp.toFixed(2)+' | Sz '+size, sig.side==='LONG'?'g':'r');
  soundEntry(sig.side);
  document.getElementById('chartWrap').classList.add(sig.side==='LONG'?'flash-g':'flash-r');
  setTimeout(()=>document.getElementById('chartWrap').classList.remove('flash-g','flash-r'),600);
  document.getElementById('livePnLBox').style.display='block';
  document.getElementById('posBar').className='pos-bar in';
  saveStore();
  drawChart();
}

/* ----- POSITION MANAGEMENT (SMART EXIT) ----- */
function managePosition(price){
  if(!S.position) return;
  const p=S.position;
  if(p.side==='LONG'){ if(price>p.highest) p.highest=price; }
  else { if(price<p.lowest) p.lowest=price; }

  const atr5=S.atr5m[S.atr5m.length-1]||0;
  const now=Date.now();
  const elapsedMin=(now-p.openTime)/60000;
  const mode=document.getElementById('botMode').value;
  const useTrail=document.getElementById('useTrail').checked;

  // Calculate current R multiple
  const move=p.side==='LONG'?price-p.entry:p.entry-price;
  const r=move/(Math.abs(p.entry-p.sl)||1);

  // Update live P&L
  const livePnL=(price-p.entry)*p.size*(p.side==='LONG'?1:-1);
  document.getElementById('livePnLVal').textContent=(livePnL>=0?'+':'')+'$'+livePnL.toFixed(2);
  document.getElementById('livePnLVal').style.color=livePnL>=0?'var(--green)':'var(--red)';

  // === 3-LEVEL PARTIAL CLOSE ===
  // Level 1: 30% at 0.5 R
  if(!p.partial1 && r>=0.5){
    p.partial1=true; p.size=Math.floor(p.size*0.7);
    const pnl=livePnL*0.3;
    S.balance+=pnl;
    log('⚡ 30% @ 0.5R | $'+pnl.toFixed(2),'o');
  }
  // Level 2: 30% at 1.0 R (now 40% of original remains)
  if(!p.partial2 && r>=1.0){
    p.partial2=true; p.size=Math.floor(p.size*0.5);
    const pnl=livePnL*0.3; // approximate
    S.balance+=pnl;
    log('⚡ 30% @ 1.0R | $'+pnl.toFixed(2),'o');
    // Move SL to entry (breakeven)
    p.sl=p.entry;
    log('🔄 SL → breakeven','b');
  }

  // === SMART EXIT (early exit on reversal) ===
  // If price reverses 0.3 ATR against us after making profit
  if(r>0.3){
    const reversal=p.side==='LONG'?p.highest-price:price-p.lowest;
    if(reversal>atr5*0.35){
      closePosition(price,'SMART EXIT');
      return;
    }
  }

  // === AGGRESSIVE TRAILING ===
  if(useTrail && r>0.5){
    const trailDist=atr5*0.4;
    const newSL=p.side==='LONG'?p.highest-trailDist:p.lowest+trailDist;
    if((p.side==='LONG'&&newSL>p.sl)||(p.side==='SHORT'&&newSL<p.sl)){
      p.sl=newSL;
    }
  }

  // === SL / TP ===
  let exitPrice=null, exitReason='';
  if(p.side==='LONG'){
    if(price<=p.sl){ exitPrice=p.sl; exitReason='STOP LOSS'; }
    else if(price>=p.tp){ exitPrice=p.tp; exitReason='TAKE PROFIT'; }
  }else{
    if(price>=p.sl){ exitPrice=p.sl; exitReason='STOP LOSS'; }
    else if(price<=p.tp){ exitPrice=p.tp; exitReason='TAKE PROFIT'; }
  }

  if(exitPrice!==null) closePosition(exitPrice,exitReason);
}

function closePosition(exitPrice,reason){
  const p=S.position; if(!p) return;
  const pnl=(exitPrice-p.entry)*p.size*(p.side==='LONG'?1:-1);
  S.balance+=pnl;

  // Update streak
  if(pnl>0) S.streak++; else S.streak=0;

  const today=new Date().toISOString().split('T')[0];
  S.dayTrades.push({
    date:today, time:new Date().toLocaleTimeString('ru-RU',{hour12:false}),
    asset:S.asset, side:p.side, strategy:p.strategy,
    entry:p.entry, exit:exitPrice, pnl:pnl, reason:reason
  });

  S.tradeMarkers.push({
    index:S.data5m.length-1, price:exitPrice, side:p.side, type:'exit',
    pnl:pnl, reason:reason, time:Date.now()
  });

  log(reason+' | '+p.side+' @ '+exitPrice.toFixed(2)+' | P&L $'+pnl.toFixed(2), pnl>=0?'g':'r');
  soundExit(pnl);

  S.position=null;
  S.cooldown=1; // minimal cooldown

  document.getElementById('livePnLBox').style.display='none';
  document.getElementById('posBar').className='pos-bar';
  saveStore();
  updateUI(); updateCalendar(); updateStats(); updateTrades(); updateHeaderStats(); drawChart();
}

/* ===================== CHART ===================== */
const canvas=document.getElementById('chartCanvas');
const ctx=canvas.getContext('2d');
let W,H;

function resize(){
  const wrap=document.getElementById('chartWrap');
  W=wrap.clientWidth; H=wrap.clientHeight;
  const dpr=window.devicePixelRatio||1;
  canvas.width=W*dpr; canvas.height=H*dpr;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  drawChart();
}
window.addEventListener('resize',resize);

function getViewData(){
  if(S.viewTF==='1m') return S.data1m;
  if(S.viewTF==='5m') return S.data5m;
  if(S.viewTF==='15m') return S.data15m;
  return S.data1h;
}

function drawChart(){
  const data=getViewData(); if(data.length<3) return;
  const pad=8; const chartH=H-15;
  const spacing=(W-pad*2)/data.length;
  const candleW=Math.max(1,spacing*0.7);

  const minP=Math.min(...data.map(x=>x.low)); const maxP=Math.max(...data.map(x=>x.high));
  const range=maxP-minP||1;
  const y=p=>chartH-((p-minP)/range)*(chartH-30)-15;
  const x=i=>pad+i*spacing+spacing/2;

  ctx.clearRect(0,0,W,H);

  // Grid
  ctx.strokeStyle='rgba(255,255,255,0.025)'; ctx.lineWidth=1;
  for(let i=0;i<=4;i++){ const yy=15+(chartH-30)*(i/4); ctx.beginPath(); ctx.moveTo(0,yy); ctx.lineTo(W,yy); ctx.stroke(); }

  // S/R
  if(S.showSR&&S.viewTF==='5m'){
    S.sr5m.forEach(l=>{
      const yy=y(l.p);
      ctx.strokeStyle=l.t==='S'?'rgba(0,255,136,0.2)':'rgba(255,51,102,0.2)';
      ctx.setLineDash([3,3]); ctx.lineWidth=1;
      ctx.beginPath(); ctx.moveTo(0,yy); ctx.lineTo(W,yy); ctx.stroke(); ctx.setLineDash([]);
    });
  }

  // Position lines
  if(S.position){
    const p=S.position;
    [{price:p.entry,col:'#fff',lab:'E'},{price:p.sl,col:'var(--red)',lab:'SL'},{price:p.tp,col:'var(--green)',lab:'TP'}].forEach(ln=>{
      const yy=y(ln.price); ctx.strokeStyle=ln.col; ctx.lineWidth=1; ctx.setLineDash([2,2]);
      ctx.beginPath(); ctx.moveTo(0,yy); ctx.lineTo(W,yy); ctx.stroke(); ctx.setLineDash([]);
    });
  }

  // Candles
  data.forEach((c,i)=>{
    const xx=x(i); const yyO=y(c.open); const yyC=y(c.close); const yyH=y(c.high); const yyL=y(c.low);
    const isG=c.close>=c.open;
    ctx.fillStyle=isG?'var(--green)':'var(--red)'; ctx.strokeStyle=ctx.fillStyle;
    ctx.beginPath(); ctx.moveTo(xx,yyH); ctx.lineTo(xx,yyL); ctx.stroke();
    const bh=Math.max(1,Math.abs(yyO-yyC));
    ctx.fillRect(xx-candleW/2,Math.min(yyO,yyC),candleW,bh);
  });

  // Trade markers
  if(S.viewTF==='5m'){
    S.tradeMarkers.forEach(m=>{
      if(m.index<0||m.index>=data.length) return;
      const xx=x(m.index);
      if(m.type==='entry'){
        ctx.font='bold 12px sans-serif'; ctx.textAlign='center';
        ctx.fillStyle=m.side==='LONG'?'var(--green)':'var(--red)';
        ctx.fillText(m.side==='LONG'?'▲':'▼',xx,y(m.price)+(m.side==='LONG'?14:-8));
      }else if(m.type==='exit'){
        const yy=y(m.price);
        ctx.beginPath(); ctx.arc(xx,yy,4,0,Math.PI*2);
        ctx.fillStyle=m.pnl>=0?'var(--green)':'var(--red)'; ctx.fill();
        ctx.strokeStyle='#fff'; ctx.lineWidth=1; ctx.stroke();
        ctx.font='bold 9px sans-serif'; ctx.fillStyle=m.pnl>=0?'var(--green)':'var(--red)';
        ctx.textAlign='center';
        ctx.fillText((m.pnl>=0?'+':'')+m.pnl.toFixed(0),xx,yy+(m.pnl>=0?-10:14));
      }
    });
  }

  // EMA
  if(S.showEMA){
    let ema9,ema21,ema50;
    if(S.viewTF==='1m'){ema9=S.ema9_1m;ema21=S.ema21_1m;}
    else if(S.viewTF==='5m'){ema9=S.ema9_5m;ema21=S.ema21_5m;ema50=S.ema50_5m;}
    else if(S.viewTF==='15m'){ema9=S.ema9_15m;ema21=S.ema21_15m;ema50=S.ema50_15m;}
    else {ema50=S.ema50_1h;}
    [{arr:ema9,col:'var(--blue)',w:1},{arr:ema21,col:'var(--orange)',w:1.5},{arr:ema50,col:'var(--purple)',w:1}].forEach(e=>{
      if(!e.arr||e.arr.length<data.length) return;
      ctx.strokeStyle=e.col; ctx.lineWidth=e.w; ctx.beginPath();
      for(let i=0;i<data.length;i++){ const yy=y(e.arr[i]); if(i===0)ctx.moveTo(x(i),yy); else ctx.lineTo(x(i),yy); }
      ctx.stroke();
    });
  }

  // VWAP
  if(S.showVWAP){
    let vwapArr;
    if(S.viewTF==='1m') vwapArr=S.vwap1m;
    else if(S.viewTF==='5m') vwapArr=S.vwap5m;
    if(vwapArr&&vwapArr.length>=data.length){
      ctx.strokeStyle='var(--gold)'; ctx.lineWidth=1; ctx.setLineDash([2,2]); ctx.beginPath();
      for(let i=0;i<data.length;i++){ const yy=y(vwapArr[i]); if(i===0)ctx.moveTo(x(i),yy); else ctx.lineTo(x(i),yy); }
      ctx.stroke(); ctx.setLineDash([]);
    }
  }

  // Tooltip
  if(S.hoverIdx>=0&&S.hoverIdx<data.length){
    const i=S.hoverIdx; const xx=x(i);
    ctx.strokeStyle='rgba(255,255,255,0.1)'; ctx.lineWidth=1; ctx.setLineDash([2,2]);
    ctx.beginPath(); ctx.moveTo(xx,0); ctx.lineTo(xx,H); ctx.stroke(); ctx.setLineDash([]);
    const c=data[i];
    const tt=document.getElementById('tooltip'); tt.style.display='block';
    let left=xx+12; if(left>W-160) left=xx-160;
    tt.style.left=left+'px'; tt.style.top='30px';
    tt.innerHTML='<div class="tt-row"><span>O</span><b>'+c.open.toFixed(2)+'</b></div>'+
      '<div class="tt-row"><span>H</span><b>'+c.high.toFixed(2)+'</b></div>'+
      '<div class="tt-row"><span>L</span><b>'+c.low.toFixed(2)+'</b></div>'+
      '<div class="tt-row"><span>C</span><b style="color:'+(c.close>=c.open?'var(--green)':'var(--red)')+'">'+c.close.toFixed(2)+'</b></div>'+
      '<div class="tt-row"><span>Vol</span><b>'+(c.volume/1000).toFixed(1)+'K</b></div>';
  }else document.getElementById('tooltip').style.display='none';
}

canvas.addEventListener('mousemove',e=>{
  const rect=canvas.getBoundingClientRect();
  const mx=e.clientX-rect.left; const data=getViewData();
  const pad=8; const spacing=(W-pad*2)/data.length;
  S.hoverIdx=Math.floor((mx-pad)/spacing);
  if(S.hoverIdx<0)S.hoverIdx=0; if(S.hoverIdx>=data.length)S.hoverIdx=data.length-1;
  drawChart();
});
canvas.addEventListener('mouseleave',()=>{S.hoverIdx=-1;drawChart();});

/* ===================== UI ===================== */
function updateUI(){
  const p=S.currentPrice;
  document.getElementById('priceMain').textContent=p?p.toFixed(ASSETS[S.asset].tick<0.01?4:2):'—';
  const today=new Date().toISOString().split('T')[0];
  const pnl=S.dayTrades.filter(t=>t.date===today).reduce((s,t)=>s+t.pnl,0);
  const el=document.getElementById('pnlToday');
  el.textContent=(pnl>=0?'+':'')+'$'+pnl.toFixed(2);
  el.style.color=pnl>=0?'var(--green)':'var(--red)';
  const bs=document.getElementById('botStatus');
  bs.textContent=S.botActive?'ON':'OFF';
  bs.style.color=S.botActive?'var(--green)':'var(--red)';
}

function updateHeaderStats(){
  const today=new Date().toISOString().split('T')[0];
  const todayTrades=S.dayTrades.filter(t=>t.date===today);
  document.getElementById('statTrades').textContent=todayTrades.length;
  if(todayTrades.length>0){
    const wins=todayTrades.filter(t=>t.pnl>0).length;
    document.getElementById('statWinRate').textContent=(wins/todayTrades.length*100).toFixed(0)+'%';
  }else{
    document.getElementById('statWinRate').textContent='—';
  }
  document.getElementById('statStreak').textContent=S.streak;
  document.getElementById('statStreak').style.color=S.streak>2?'var(--green)':S.streak<-2?'var(--red)':'var(--text)';
}

function updateCalendar(){
  const grid=document.getElementById('calendarGrid'); grid.innerHTML='';
  const now=new Date(); const y=now.getFullYear(); const m=now.getMonth();
  const dim=new Date(y,m+1,0).getDate(); const fd=new Date(y,m,1).getDay();
  const days=['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];
  days.forEach(dn=>{const h=document.createElement('div');h.style='font-size:9px;color:var(--dim);text-align:center';h.textContent=dn;grid.appendChild(h);});
  for(let i=0;i<(fd===0?6:fd-1);i++)grid.appendChild(document.createElement('div'));
  for(let d=1;d<=dim;d++){
    const ds=y+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    const pnl=S.dayTrades.filter(t=>t.date===ds).reduce((s,t)=>s+t.pnl,0);
    const cell=document.createElement('div');
    cell.style='background:var(--bg);border:1px solid var(--border);border-radius:3px;padding:4px;text-align:center;font-size:10px;min-height:45px';
    if(pnl>0)cell.style.cssText+=';background:rgba(0,255,136,0.06);border-color:rgba(0,255,136,0.15)';
    if(pnl<0)cell.style.cssText+=';background:rgba(255,51,102,0.06);border-color:rgba(255,51,102,0.15)';
    cell.innerHTML='<div style="font-size:9px;color:var(--dim)">'+d+'</div>'+(pnl!==0?'<div style="font-weight:700;font-size:10px;color:'+(pnl>0?'var(--green)':'var(--red)')+'">'+(pnl>0?'+':'')+pnl.toFixed(0)+'</div>':'');
    grid.appendChild(cell);
  }
}

function updateStats(){
  const t=S.dayTrades;
  document.getElementById('stTotal').textContent=t.length;
  if(!t.length){['stWin','stPF','stAvg','stBest','stWorst'].forEach(id=>document.getElementById(id).textContent='—');return;}
  const wins=t.filter(x=>x.pnl>0).length;
  document.getElementById('stWin').textContent=(wins/t.length*100).toFixed(1)+'%';
  const gp=t.filter(x=>x.pnl>0).reduce((s,x)=>s+x.pnl,0);
  const gl=Math.abs(t.filter(x=>x.pnl<0).reduce((s,x)=>s+x.pnl,0))||1;
  document.getElementById('stPF').textContent=(gp/gl).toFixed(2);
  document.getElementById('stAvg').textContent='$'+(t.reduce((s,x)=>s+x.pnl,0)/t.length).toFixed(2);
  document.getElementById('stBest').textContent='$'+Math.max(...t.map(x=>x.pnl)).toFixed(2);
  document.getElementById('stWorst').textContent='$'+Math.min(...t.map(x=>x.pnl)).toFixed(2);
}

function updateTrades(){
  const tbody=document.getElementById('tradesBody'); tbody.innerHTML='';
  [...S.dayTrades].reverse().slice(0,50).forEach(t=>{
    const tr=document.createElement('tr');
    tr.innerHTML='<td>'+t.time+'</td><td>'+t.strategy+'</td><td style="color:'+(t.side==='LONG'?'var(--green)':'var(--red)')+'">'+t.side+'</td><td>'+t.entry.toFixed(2)+'</td><td>'+t.exit.toFixed(2)+'</td><td style="color:'+(t.pnl>=0?'var(--green)':'var(--red)')+'">'+(t.pnl>=0?'+':'')+t.pnl.toFixed(2)+'</td><td>'+t.reason+'</td>';
    tbody.appendChild(tr);
  });
}

/* ===================== CONTROLS ===================== */
document.getElementById('assetSelect').addEventListener('change',e=>{
  S.asset=e.target.value; S.data1m=[];S.data5m=[];S.data15m=[];S.data1h=[];S.tradeMarkers=[];
  if(S.ws){S.ws.close();S.ws=null;} loadAll();
  log('Актив: '+ASSETS[S.asset].name,'b');
});

document.getElementById('btnStart').addEventListener('click',()=>{
  S.botActive=!S.botActive;
  const btn=document.getElementById('btnStart');
  if(S.botActive){ btn.textContent='⏹ STOP TURBO'; btn.className='btn btn-stop'; log('TURBO ЗАПУЩЕН','g'); }
  else { btn.textContent='▶ START TURBO'; btn.className='btn btn-turbo'; log('TURBO ОСТАНОВЛЕН','r'); S.position=null; document.getElementById('livePnLBox').style.display='none'; document.getElementById('posBar').className='pos-bar'; }
});

['1m','5m','15m','1h'].forEach(tf=>{
  document.getElementById('tf'+tf).addEventListener('click',()=>{
    ['1m','5m','15m','1h'].forEach(t=>document.getElementById('tf'+t).classList.remove('active'));
    document.getElementById('tf'+tf).classList.add('active');
    S.viewTF=tf; drawChart();
  });
});

function toggleBtn(id,flag){ S[flag]=!S[flag]; document.getElementById(id).classList.toggle('active',S[flag]); drawChart(); }
document.getElementById('tEMA').addEventListener('click',()=>toggleBtn('tEMA','showEMA'));
document.getElementById('tVWAP').addEventListener('click',()=>toggleBtn('tVWAP','showVWAP'));
document.getElementById('tSR').addEventListener('click',()=>toggleBtn('tSR','showSR'));

// Strategy toggles
document.querySelectorAll('.strat-item').forEach(el=>{
  el.addEventListener('click',()=>{
    el.classList.toggle('on'); el.classList.toggle('off');
    el.classList.toggle('on',el.classList.contains('on'));
  });
});

document.querySelectorAll('.tab').forEach(tab=>{
  tab.addEventListener('click',()=>{
    document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
    tab.classList.add('active');
    ['stats','trades','calendar'].forEach(c=>document.getElementById('tab'+c.charAt(0).toUpperCase()+c.slice(1)).classList.add('hidden'));
    document.getElementById('tab'+tab.dataset.tab.charAt(0).toUpperCase()+tab.dataset.tab.slice(1)).classList.remove('hidden');
  });
});

/* ===================== INIT ===================== */
resize();
loadAll();
setInterval(()=>{ if(!S.wsConnected) connectWS(); },5000);
updateCalendar(); updateStats(); updateTrades(); updateHeaderStats();
log('TURBO SCALPER загружен. 4 стратегии + Smart Exit + 3-level close.','b');
</script>
</body>
</html>
