<script>
// ==================== КОНФИГ ====================
const CONFIG = {
  wsUrl: 'wss://stream.binance.com:9443/ws',
  apiUrl: 'https://api.binance.com/api/v3',
  intervals: { '1m': '1m', '5m': '5m', '15m': '15m', '1h': '1h' },
  limit: 150,
  colors: {
    bg: '#0f172a', grid: '#1e293b', text: '#64748b',
    green: '#00ff88', red: '#ff3366', blue: '#00ccff',
    orange: '#f59e0b', purple: '#a855f7', yellow: '#fbbf24',
    vwap: '#a855f7', ema9: '#fbbf24', ema21: '#00ccff', ema50: '#f59e0b',
    bb: '#334155', volumeUp: '#00ff8833', volumeDown: '#ff336633'
  }
};

// ==================== СОСТОЯНИЕ ====================
let state = {
  symbol: 'PAXGUSDT', tf: '5m', connected: false, running: false,
  candles: {}, ticks: [],
  position: null, // {dir, entry, sl, tp, size, strategy, layers, entryTime, entryCandleIdx}
  history: [], // закрытые сделки
  tradeMarkers: [], // маркеры для графика
  mode: 'turbo',
  ws: null, wsSub: null,
  stats: { total: 0, wins: 0, losses: 0, pnl: 0, streak: [], sessionStart: null },
  strategyStats: {
    MOMENTUM:  {trades:0, wins:0, losses:0, pnl:0},
    VWAP:      {trades:0, wins:0, losses:0, pnl:0},
    BREAK:     {trades:0, wins:0, losses:0, pnl:0},
    PULLBACK:  {trades:0, wins:0, losses:0, pnl:0}
  },
  lastScan: 0,
  zoom: { scale: 1, offset: 0, dragging: false, dragStartX: 0, dragStartOffset: 0 },
  audioCtx: null
};

// ==================== УТИЛИТЫ ====================
function safeAdd(id, event, handler) {
  const el = document.getElementById(id);
  if (el) el.addEventListener(event, handler);
}
function $(id){ return document.getElementById(id); }
function log(msg, type='info') {
  const panel = $('log');
  if (!panel) return;
  const div = document.createElement('div');
  div.className = 'log-entry';
  const time = new Date().toLocaleTimeString('ru-RU',{hour12:false});
  let color = '#e2e8f0';
  if (type==='entry') color='#00ff88';
  if (type==='exit') color='#60a5fa';
  if (type==='sl') color='#ff3366';
  if (type==='tp') color='#00ff88';
  if (type==='warn') color='#fbbf24';
  div.innerHTML = `<span class="log-time">${time}</span><span style="color:${color}">${msg}</span>`;
  panel.insertBefore(div, panel.firstChild);
  while (panel.children.length > 100) panel.removeChild(panel.lastChild);
}
function playSound(type) {
  if (!state.audioCtx) state.audioCtx = new (window.AudioContext||window.webkitAudioContext)();
  const ctx = state.audioCtx;
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.connect(gain); gain.connect(ctx.destination);
  if (type==='entry') { osc.frequency.value=880; gain.gain.value=0.1; }
  else if (type==='exit') { osc.frequency.value=660; gain.gain.value=0.08; }
  else if (type==='sl') { osc.frequency.value=220; gain.gain.value=0.12; }
  else { osc.frequency.value=440; gain.gain.value=0.05; }
  osc.start(); osc.stop(ctx.currentTime+0.12);
}

// ==================== BINANCE API ====================
async function fetchKlines(symbol, interval, limit=150) {
  try {
    const r = await fetch(`${CONFIG.apiUrl}/klines?symbol=${symbol}&interval=${interval}&limit=${limit}`);
    if (!r.ok) throw new Error('HTTP '+r.status);
    const data = await r.json();
    return data.map(d => ({
      t: d[0], open: +d[1], high: +d[2], low: +d[3], close: +d[4],
      volume: +d[5], quoteVolume: +d[7]
    }));
  } catch(e) { log('Ошибка загрузки свечей: '+e.message, 'warn'); return null; }
}
async function fetch24h(symbol) {
  try {
    const r = await fetch(`${CONFIG.apiUrl}/ticker/24hr?symbol=${symbol}`);
    if (!r.ok) return null;
    return await r.json();
  } catch(e) { return null; }
}

// ==================== ИНДИКАТОРЫ ====================
function sma(arr, n) {
  const res = [];
  for (let i=0;i<arr.length;i++) {
    if (i<n-1) { res.push(null); continue; }
    let s=0; for(let j=0;j<n;j++) s+=arr[i-j].close;
    res.push(s/n);
  }
  return res;
}
function ema(arr, n) {
  const res = []; let k = 2/(n+1);
  for (let i=0;i<arr.length;i++) {
    if (i===0) { res.push(arr[0].close); continue; }
    if (i<n-1) { res.push(arr[i].close); continue; }
    res.push(arr[i].close*k + res[i-1]*(1-k));
  }
  return res;
}
function atr(candles, n=14) {
  const res = [];
  for (let i=0;i<candles.length;i++) {
    if (i===0) { res.push(candles[i].high-candles[i].low); continue; }
    const tr = Math.max(candles[i].high-candles[i].low, Math.abs(candles[i].high-candles[i-1].close), Math.abs(candles[i].low-candles[i-1].close));
    if (i<n) { res.push(tr); continue; }
    res.push((res[i-1]*(n-1)+tr)/n);
  }
  return res;
}
function vwap(candles) {
  let cumPV=0, cumV=0;
  return candles.map(c => {
    const tp = (c.high+c.low+c.close)/3;
    cumPV += tp*c.volume; cumV += c.volume;
    return cumV>0 ? cumPV/cumV : c.close;
  });
}
function bb(candles, n=20, k=2) {
  const mid = sma(candles, n);
  const res = { mid, upper: [], lower: [], width: [] };
  for (let i=0;i<candles.length;i++) {
    if (i<n-1) { res.upper.push(null); res.lower.push(null); res.width.push(0); continue; }
    let s=0; for(let j=0;j<n;j++) s+=Math.pow(candles[i-j].close-mid[i],2);
    const std = Math.sqrt(s/n);
    res.upper.push(mid[i]+k*std);
    res.lower.push(mid[i]-k*std);
    res.width.push((2*k*std)/mid[i]*100);
  }
  return res;
}
function adx(candles, n=14) {
  const dx = []; let plusDM=0, minusDM=0, trSum=0;
  for (let i=1;i<candles.length;i++) {
    const up = candles[i].high-candles[i-1].high;
    const down = candles[i-1].low-candles[i].low;
    const pdm = (up>down && up>0) ? up : 0;
    const mdm = (down>up && down>0) ? down : 0;
    const tr = Math.max(candles[i].high-candles[i].low, Math.abs(candles[i].high-candles[i-1].close), Math.abs(candles[i].low-candles[i-1].close));
    if (i<=n) { plusDM+=pdm; minusDM+=mdm; trSum+=tr; }
    else {
      plusDM = (plusDM*(n-1)+pdm)/n;
      minusDM = (minusDM*(n-1)+mdm)/n;
      trSum = (trSum*(n-1)+tr)/n;
    }
    if (i>=n && trSum>0) {
      const pdi = 100*plusDM/trSum;
      const mdi = 100*minusDM/trSum;
      const d = Math.abs(pdi-mdi)/(pdi+mdi)*100;
      dx.push(d);
    } else dx.push(null);
  }
  dx.unshift(null);
  const adxArr = [];
  for (let i=0;i<dx.length;i++) {
    if (i<n || dx[i]===null) { adxArr.push(null); continue; }
    if (i===n) adxArr.push(dx.slice(1,n+1).reduce((a,b)=>a+b,0)/n);
    else adxArr.push((adxArr[i-1]*(n-1)+dx[i])/n);
  }
  return adxArr;
}
function rsi(candles, n=14) {
  let gains=0, losses=0;
  const res = [];
  for (let i=0;i<candles.length;i++) {
    if (i===0) { res.push(50); continue; }
    const change = candles[i].close - candles[i-1].close;
    const gain = change>0 ? change : 0;
    const loss = change<0 ? -change : 0;
    if (i<=n) { gains+=gain; losses+=loss; }
    else { gains=(gains*(n-1)+gain)/n; losses=(losses*(n-1)+loss)/n; }
    if (i>=n) {
      const rs = losses>0 ? gains/losses : 999;
      res.push(100 - 100/(1+rs));
    } else res.push(50);
  }
  return res;
}

// ==================== АНАЛИЗ РЫНКА ====================
function analyzeMarket(candles) {
  if (candles.length<55) return { mode:'MIXED', adx:0, trend:'flat', spread:0 };
  const ema9v = ema(candles, 9);
  const ema21v = ema(candles, 21);
  const ema50v = ema(candles, 50);
  const atrv = atr(candles, 14);
  const adxv = adx(candles, 14);
  const bbv = bb(candles, 20, 2);
  const vw = vwap(candles);
  const last = candles.length-1;
  const price = candles[last].close;
  const spread = ((candles[last].high-candles[last].low)/price)*100;
  const adxVal = adxv[last]||0;
  const bbWidth = bbv.width[last]||0;
  const aboveEma50 = price > (ema50v[last]||price);
  const distEma50 = Math.abs(price-(ema50v[last]||price))/price*100;
  let mode = 'MIXED';
  if (adxVal>25 && distEma50>0.15) mode = aboveEma50 ? 'TREND_UP' : 'TREND_DOWN';
  else if (bbWidth<0.5 && adxVal<20) mode = 'SQUEEZE';
  else if (adxVal<20 && distEma50<0.1) mode = 'RANGE';
  return { mode, adx: adxVal, trend: aboveEma50?'up':'down', spread, bbWidth, ema9:ema9v[last], ema21:ema21v[last], ema50:ema50v[last], vwap:vw[last], atr:atrv[last], bb:bbv };
}

// ==================== СТРАТЕГИИ ====================
function checkMomentum(candles, vol) {
  if (candles.length<3) return null;
  const last = candles[candles.length-1];
  const prev = candles[candles.length-2];
  const pprev = candles[candles.length-3];
  const avgVol = candles.slice(-20).reduce((s,c)=>s+c.volume,0)/20;
  if (vol < avgVol*1.2) return null;
  if (last.close > prev.high && last.close > pprev.high) return { dir:'LONG', reason:'Пробой high 2 свечей', strategy:'MOMENTUM' };
  if (last.close < prev.low && last.close < pprev.low) return { dir:'SHORT', reason:'Пробой low 2 свечей', strategy:'MOMENTUM' };
  return null;
}
function checkVwap(candles, vol) {
  if (candles.length<30) return null;
  const vw = vwap(candles);
  const last = candles.length-1;
  const price = candles[last].close;
  const avgVol = candles.slice(-20).reduce((s,c)=>s+c.volume,0)/20;
  if (vol < avgVol*0.8) return null;
  if (price > vw[last] && candles[last].low <= vw[last]*1.0005 && candles[last].close > vw[last]) return { dir:'LONG', reason:'Отскок от VWAP вверх', strategy:'VWAP' };
  if (price < vw[last] && candles[last].high >= vw[last]*0.9995 && candles[last].close < vw[last]) return { dir:'SHORT', reason:'Отскок от VWAP вниз', strategy:'VWAP' };
  return null;
}
function checkBreak(candles, vol) {
  if (candles.length<22) return null;
  const last = candles.length-1;
  const range = candles.slice(last-20, last);
  const hh = Math.max(...range.map(c=>c.high));
  const ll = Math.min(...range.map(c=>c.low));
  const avgVol = candles.slice(-20).reduce((s,c)=>s+c.volume,0)/20;
  if (vol < avgVol*1.3) return null;
  if (candles[last].close > hh && candles[last].open < hh) return { dir:'LONG', reason:'Пробой 20-барного диапазона', strategy:'BREAK' };
  if (candles[last].close < ll && candles[last].open > ll) return { dir:'SHORT', reason:'Пробой 20-барного диапазона вниз', strategy:'BREAK' };
  return null;
}
function checkPullback(candles, vol) {
  if (candles.length<15) return null;
  const ema9v = ema(candles, 9);
  const last = candles.length-1;
  const price = candles[last].close;
  const e9 = ema9v[last];
  const avgVol = candles.slice(-20).reduce((s,c)=>s+c.volume,0)/20;
  if (vol < avgVol*0.9) return null;
  const body = Math.abs(candles[last].close-candles[last].open);
  const range = candles[last].high-candles[last].low;
  const isBull = candles[last].close > candles[last].open;
  const isBear = candles[last].close < candles[last].open;
  if (price > e9 && candles[last].low <= e9*1.0003 && isBull) return { dir:'LONG', reason:'Откат к EMA9 + бычья свеча', strategy:'PULLBACK' };
  if (price < e9 && candles[last].high >= e9*0.9997 && isBear) return { dir:'SHORT', reason:'Откат к EMA9 + медвежья свеча', strategy:'PULLBACK' };
  return null;
}

// ==================== УПРАВЛЕНИЕ ПОЗИЦИЕЙ ====================
function calculateSize(riskPct, slPrice, entry, leverage) {
  const account = 10000; // условный депозит
  const riskAmount = account * (riskPct/100);
  const slDist = Math.abs(entry - slPrice) / entry;
  if (slDist === 0) return 0;
  const size = (riskAmount / slDist) * leverage;
  return Math.min(size, account * leverage * 0.95);
}

function openPosition(dir, entry, sl, tp, strategy, reason) {
  if (state.position) return;
  const risk = parseFloat($('riskPct').value)||1.5;
  const lev = parseFloat($('leverage').value)||5;
  const size = calculateSize(risk, sl, entry, lev);
  state.position = {
    dir, entry, sl, tp, size, strategy, reason,
    layers: [{entry, size: size*0.3}, {entry, size: size*0.3}, {entry, size: size*0.4}],
    closedLayers: 0,
    entryTime: Date.now(),
    entryCandleIdx: state.candles[state.tf] ? state.candles[state.tf].length-1 : 0,
    maxProfit: 0,
    layer1Done: false, layer2Done: false
  };
  state.stats.total++;
  state.strategyStats[strategy].trades++;
  playSound('entry');
  log(`🚀 ВХОД ${dir} @ ${entry.toFixed(2)} | ${strategy} | ${reason}`, 'entry');
  addJournalEntry('ENTRY', {dir, entry, strategy, reason, sl, tp, time: new Date().toLocaleTimeString('ru-RU')});
  updateUI();
}

function closePosition(reason, exitPrice) {
  if (!state.position) return;
  const pos = state.position;
  const mode = $('botMode').value;
  let pnl = 0;
  if (pos.dir === 'LONG') pnl = (exitPrice - pos.entry) / pos.entry * 100 * parseFloat($('leverage').value);
  else pnl = (pos.entry - exitPrice) / pos.entry * 100 * parseFloat($('leverage').value);
  const isWin = pnl > 0;
  state.stats.pnl += pnl;
  state.strategyStats[pos.strategy].pnl += pnl;
  if (isWin) { state.stats.wins++; state.strategyStats[pos.strategy].wins++; state.stats.streak.push('W'); }
  else { state.stats.losses++; state.strategyStats[pos.strategy].losses++; state.stats.streak.push('L'); }
  while (state.stats.streak.length > 15) state.stats.streak.shift();
  state.history.push({...pos, exit: exitPrice, pnl, reason, exitTime: Date.now()});
  state.tradeMarkers.push({
    type: 'exit', dir: pos.dir, price: exitPrice, pnl,
    time: Date.now(), reason,
    candleIdx: state.candles[state.tf] ? state.candles[state.tf].length-1 : 0
  });
  playSound(isWin ? 'exit' : 'sl');
  log(`${reason} | ${pos.dir} @ ${exitPrice.toFixed(2)} | P&L ${pnl>=0?'+':''}${pnl.toFixed(2)}% | Стратегия: ${pos.strategy}`, isWin?'tp':'sl');
  addJournalEntry('EXIT', {dir:pos.dir, entry:pos.entry, exit:exitPrice, pnl, strategy:pos.strategy, reason, time: new Date().toLocaleTimeString('ru-RU')});
  state.position = null;
  updateUI();
}

function addJournalEntry(type, data) {
  const panel = $('journal');
  if (!panel) return;
  const div = document.createElement('div');
  div.className = 'log-entry';
  div.style.borderLeft = type==='ENTRY' ? '2px solid #00ff88' : '2px solid #60a5fa';
  div.style.paddingLeft = '6px';
  div.style.marginBottom = '4px';
  if (type === 'ENTRY') {
    div.innerHTML = `<span class="log-time">${data.time}</span><span class="entry">▲ ВХОД ${data.dir}</span> @ ${data.entry.toFixed(2)}<br><span style="color:#94a3b8;margin-left:28px">${data.strategy} | SL ${data.sl.toFixed(2)} | TP ${data.tp.toFixed(2)}</span><br><span style="color:#64748b;margin-left:28px;font-size:10px">${data.reason}</span>`;
  } else {
    const pnlClass = data.pnl >= 0 ? 'pnl-pos' : 'pnl-neg';
    div.innerHTML = `<span class="log-time">${data.time}</span><span class="exit">▼ ВЫХОД ${data.dir}</span> @ ${data.exit.toFixed(2)}<br><span style="color:#94a3b8;margin-left:28px">${data.reason} | Стратегия: ${data.strategy}</span><br><span class="${pnlClass}" style="margin-left:28px;font-size:12px">P&L: ${data.pnl>=0?'+':''}${data.pnl.toFixed(2)}%</span>`;
  }
  panel.insertBefore(div, panel.firstChild);
  while (panel.children.length > 80) panel.removeChild(panel.lastChild);
}

function checkExit(price, candles) {
  if (!state.position) return;
  const pos = state.position;
  const atrv = atr(candles, 14);
  const atrVal = atrv[atrv.length-1] || (price*0.001);
  const lev = parseFloat($('leverage').value)||5;
  const r = pos.dir==='LONG' ? (price-pos.entry)/pos.entry*100*lev : (pos.entry-price)/pos.entry*100*lev;
  const rRaw = pos.dir==='LONG' ? (price-pos.entry)/pos.entry*100 : (pos.entry-price)/pos.entry*100;
  const slDist = Math.abs(pos.entry-pos.sl)/pos.entry*100;
  const rMultiple = slDist>0 ? Math.abs(rRaw)/slDist : 0;
  // Обновить макс профит
  if (r > pos.maxProfit) pos.maxProfit = r;
  // Smart Exit: разворот на 0.35 ATR от макс профита
  if (pos.maxProfit > 0.3 && r < pos.maxProfit - (0.35*atrVal/pos.entry*100*lev)) {
    closePosition('Smart Exit (разворот)', price); return;
  }
  // 3-уровневое закрытие
  if (!pos.layer1Done && rMultiple >= 0.5) {
    pos.layer1Done = true;
    log(`Закрытие слоя 1 (30%) @ ${price.toFixed(2)} | +${r.toFixed(2)}%`, 'tp');
  }
  if (!pos.layer2Done && rMultiple >= 1.0) {
    pos.layer2Done = true;
    // Перенос SL в безубыток
    if (pos.dir==='LONG') pos.sl = pos.entry + (pos.entry-pos.sl)*0.1;
    else pos.sl = pos.entry - (pos.sl-pos.entry)*0.1;
    log(`Закрытие слоя 2 (30%) + SL в безубыток @ ${price.toFixed(2)} | +${r.toFixed(2)}%`, 'tp');
  }
  // SL / TP
  if (pos.dir==='LONG') {
    if (price <= pos.sl) { closePosition('STOP LOSS', price); return; }
    if (price >= pos.tp) { closePosition('TAKE PROFIT', price); return; }
  } else {
    if (price >= pos.sl) { closePosition('STOP LOSS', price); return; }
    if (price <= pos.tp) { closePosition('TAKE PROFIT', price); return; }
  }
  // Агрессивный трейлинг SL каждые 0.4 ATR
  const trailStep = 0.4 * atrVal;
  if (pos.dir==='LONG' && price > pos.entry + trailStep) {
    const newSl = price - trailStep;
    if (newSl > pos.sl) pos.sl = newSl;
  }
  if (pos.dir==='SHORT' && price < pos.entry - trailStep) {
    const newSl = price + trailStep;
    if (newSl < pos.sl) pos.sl = newSl;
  }
}

// ==================== СКАНЕР ====================
function scan() {
  if (!state.running) return;
  const now = Date.now();
  if (now - state.lastScan < 5000) return;
  state.lastScan = now;
  const candles = state.candles[state.tf];
  if (!candles || candles.length<30) { log('Недостаточно данных...'); return; }
  const last = candles[candles.length-1];
  const analysis = analyzeMarket(candles);
  const mode = $('botMode').value;
  $('marketMode').textContent = analysis.mode;
  $('atrVal').textContent = analysis.atr ? analysis.atr.toFixed(2) : '--';
  $('vwapVal').textContent = analysis.vwap ? analysis.vwap.toFixed(2) : '--';
  $('spreadVal').textContent = analysis.spread ? analysis.spread.toFixed(3)+'%' : '--';
  log(`Сканирование... Режим: ${analysis.mode} | ADX:${analysis.adx.toFixed(1)} | Спред:${analysis.spread.toFixed(3)}%`);
  if (state.position) { checkExit(last.close, candles); return; }
  // Фильтры
  if (analysis.spread > 0.15 && mode==='turbo') { log('Сигнал заблокирован: широкий спред','warn'); return; }
  if (analysis.adx < 15 && mode==='turbo') { log('Сигнал заблокирован: ADX слишком низкий','warn'); return; }
  // Проверка сессии
  const h = new Date().getUTCHours();
  let sessionOk = true;
  if (mode==='standard' && (h<7 || h>17)) sessionOk = false;
  if (mode==='safe' && (h<12 || h>16)) sessionOk = false;
  if (!sessionOk) { log('Вне торговой сессии','warn'); return; }
  // Проверка стратегий
  const strategies = [];
  if ($('useMomentum').checked) { const s=checkMomentum(candles, last.volume); if(s) strategies.push(s); }
  if ($('useVwap').checked) { const s=checkVwap(candles, last.volume); if(s) strategies.push(s); }
  if ($('useBreak').checked) { const s=checkBreak(candles, last.volume); if(s) strategies.push(s); }
  if ($('usePullback').checked) { const s=checkPullback(candles, last.volume); if(s) strategies.push(s); }
  if (strategies.length===0) { log('Сигналов нет'); return; }
  // Выбор лучшей
  const best = strategies[0];
  const atrVal = analysis.atr || (last.close*0.001);
  const slAtr = parseFloat($('slAtr').value)||0.6;
  const tpAtr = parseFloat($('tpAtr').value)||1.8;
  let sl, tp;
  if (best.dir==='LONG') {
    sl = last.close - atrVal*slAtr;
    tp = last.close + atrVal*tpAtr;
  } else {
    sl = last.close + atrVal*slAtr;
    tp = last.close - atrVal*tpAtr;
  }
  // Маркер входа
  state.tradeMarkers.push({
    type: 'entry', dir: best.dir, price: last.close, strategy: best.strategy,
    time: Date.now(), candleIdx: candles.length-1
  });
  openPosition(best.dir, last.close, sl, tp, best.strategy, best.reason);
}

// ==================== WEBSOCKET ====================
function connectWS() {
  if (state.ws) return;
  const ws = new WebSocket(`${CONFIG.wsUrl}/${state.symbol.toLowerCase()}@kline_${state.tf}`);
  ws.onopen = () => {
    state.connected = true;
    $('wsBadge').textContent = 'WS ●';
    $('wsBadge').style.background = '#059669';
    log('WebSocket подключен');
  };
  ws.onmessage = (e) => {
    const msg = JSON.parse(e.data);
    if (msg.e==='kline') {
      const k = msg.k;
      const candle = { t:k.t, open:+k.o, high:+k.h, low:+k.l, close:+k.c, volume:+k.v, quoteVolume:+k.q, closed:k.x };
      const arr = state.candles[state.tf] = state.candles[state.tf]||[];
      const last = arr[arr.length-1];
      if (last && last.t===candle.t) {
        arr[arr.length-1] = candle;
      } else if (!last || candle.t > last.t) {
        arr.push(candle);
        if (arr.length>300) arr.shift();
      }
      if (candle.closed) scan();
      $('lastPrice').textContent = candle.close.toFixed(2);
      const change = ((candle.close - arr[0].open)/arr[0].open*100);
      const chEl = $('priceChange');
      chEl.textContent = (change>=0?'+':'')+change.toFixed(2)+'%';
      chEl.className = change>=0?'up':'down';
      drawChart();
    }
  };
  ws.onerror = () => { log('WS ошибка','warn'); };
  ws.onclose = () => {
    state.connected = false;
    $('wsBadge').textContent = 'WS ○';
    $('wsBadge').style.background = '#dc2626';
    log('WS отключен','warn');
    state.ws = null;
    setTimeout(connectWS, 5000);
  };
  state.ws = ws;
}
function disconnectWS() {
  if (state.ws) { state.ws.close(); state.ws=null; }
}

// ==================== ГРАФИК (CANVAS) ====================
function resizeCanvas() {
  const c = $('chart');
  if (!c) return;
  const rect = c.parentElement.getBoundingClientRect();
  c.width = rect.width * window.devicePixelRatio;
  c.height = rect.height * window.devicePixelRatio;
  drawChart();
}

function drawChart() {
  const c = $('chart');
  if (!c) return;
  const ctx = c.getContext('2d');
  const w = c.width, h = c.height;
  const dpr = window.devicePixelRatio;
  const candles = state.candles[state.tf];
  if (!candles || candles.length<2) return;
  const z = state.zoom;
  const total = candles.length;
  const visibleCount = Math.max(20, Math.floor(total / z.scale));
  const startIdx = Math.max(0, Math.min(total - visibleCount, Math.floor(z.offset * total)));
  const endIdx = Math.min(total, startIdx + visibleCount);
  const visible = candles.slice(startIdx, endIdx);
  if (visible.length<2) return;
  const padding = { top: 40, bottom: 60, right: 80, left: 10 };
  const chartH = h - padding.top - padding.bottom;
  const chartW = w - padding.left - padding.right;
  const highs = visible.map(c=>c.high);
  const lows = visible.map(c=>c.low);
  const maxP = Math.max(...highs);
  const minP = Math.min(...lows);
  const rangeP = maxP - minP || 1;
  const candleW = Math.max(2, (chartW / visible.length) * 0.7);
  const gap = chartW / visible.length;
  const y = (price) => padding.top + (1 - (price - minP)/rangeP) * chartH;
  const x = (i) => padding.left + i * gap + gap/2;

  ctx.clearRect(0,0,w,h);
  ctx.fillStyle = CONFIG.colors.bg;
  ctx.fillRect(0,0,w,h);

  // Сетка
  ctx.strokeStyle = CONFIG.colors.grid;
  ctx.lineWidth = 1;
  for (let i=0;i<=5;i++) {
    const yy = padding.top + (chartH/5)*i;
    ctx.beginPath(); ctx.moveTo(padding.left,yy); ctx.lineTo(w-padding.right,yy); ctx.stroke();
    const price = maxP - (rangeP/5)*i;
    ctx.fillStyle = CONFIG.colors.text;
    ctx.font = `${10*dpr}px sans-serif`;
    ctx.textAlign = 'right';
    ctx.fillText(price.toFixed(2), w-5, yy+4);
  }

  // Индикаторы
  const ema9v = ema(candles, 9);
  const ema21v = ema(candles, 21);
  const vw = vwap(candles);
  const bbv = bb(candles, 20, 2);

  function drawLine(values, color, width=2) {
    ctx.strokeStyle = color;
    ctx.lineWidth = width;
    ctx.beginPath();
    let started = false;
    for (let i=0;i<visible.length;i++) {
      const gi = startIdx + i;
      const v = values[gi];
      if (v===null || v===undefined) continue;
      const px = x(i), py = y(v);
      if (!started) { ctx.moveTo(px,py); started=true; }
      else ctx.lineTo(px,py);
    }
    ctx.stroke();
  }
  drawLine(ema9v, CONFIG.colors.ema9);
  drawLine(ema21v, CONFIG.colors.ema21);
  drawLine(vw, CONFIG.colors.vwap);
  drawLine(bbv.upper, CONFIG.colors.bb, 1);
  drawLine(bbv.lower, CONFIG.colors.bb, 1);

  // Свечи
  for (let i=0;i<visible.length;i++) {
    const cnd = visible[i];
    const cx = x(i);
    const isUp = cnd.close >= cnd.open;
    ctx.fillStyle = isUp ? CONFIG.colors.green : CONFIG.colors.red;
    ctx.strokeStyle = isUp ? CONFIG.colors.green : CONFIG.colors.red;
    // Тень
    ctx.beginPath();
    ctx.moveTo(cx, y(cnd.high));
    ctx.lineTo(cx, y(cnd.low));
    ctx.stroke();
    // Тело
    const top = y(Math.max(cnd.open, cnd.close));
    const bot = y(Math.min(cnd.open, cnd.close));
    const bodyH = Math.max(1, bot-top);
    ctx.fillRect(cx - candleW/2, top, candleW, bodyH);
  }

  // Объёмы
  const maxVol = Math.max(...visible.map(c=>c.volume));
  const volH = 40 * dpr;
  const volY = h - padding.bottom + 5;
  for (let i=0;i<visible.length;i++) {
    const cnd = visible[i];
    const cx = x(i);
    const vh = (cnd.volume/maxVol) * volH;
    ctx.fillStyle = cnd.close>=cnd.open ? CONFIG.colors.volumeUp : CONFIG.colors.volumeDown;
    ctx.fillRect(cx - candleW/2, volY + volH - vh, candleW, vh);
  }

  // Маркеры сделок
  const markers = state.tradeMarkers.filter(m => m.candleIdx >= startIdx && m.candleIdx < endIdx);
  for (const m of markers) {
    const mi = m.candleIdx - startIdx;
    const mx = x(mi);
    const my = y(m.price);
    if (m.type === 'entry') {
      ctx.fillStyle = m.dir==='LONG' ? CONFIG.colors.green : CONFIG.colors.red;
      ctx.beginPath();
      if (m.dir==='LONG') {
        ctx.moveTo(mx, my-12); ctx.lineTo(mx-6, my-4); ctx.lineTo(mx+6, my-4);
      } else {
        ctx.moveTo(mx, my+12); ctx.lineTo(mx-6, my+4); ctx.lineTo(mx+6, my+4);
      }
      ctx.fill();
      // Подпись стратегии
      ctx.fillStyle = CONFIG.colors.yellow;
      ctx.font = `${9*dpr}px sans-serif`;
      ctx.textAlign = 'center';
      ctx.fillText(m.strategy, mx, m.dir==='LONG'?my-16:my+22);
    } else {
      ctx.beginPath();
      ctx.arc(mx, my, 5, 0, Math.PI*2);
      ctx.fillStyle = m.pnl>=0 ? CONFIG.colors.green : CONFIG.colors.red;
      ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.font = `${9*dpr}px sans-serif`;
      ctx.textAlign = 'center';
      ctx.fillText((m.pnl>=0?'+':'')+m.pnl.toFixed(1)+'%', mx, my-10);
    }
  }

  // Текущая позиция
  if (state.position) {
    const pos = state.position;
    const lastIdx = candles.length-1;
    if (lastIdx >= startIdx && lastIdx < endIdx) {
      const px = x(lastIdx - startIdx);
      // Линия входа
      ctx.strokeStyle = CONFIG.colors.orange;
      ctx.setLineDash([5,5]);
      ctx.beginPath(); ctx.moveTo(padding.left, y(pos.entry)); ctx.lineTo(w-padding.right, y(pos.entry)); ctx.stroke();
      ctx.setLineDash([]);
      // SL
      ctx.strokeStyle = CONFIG.colors.red;
      ctx.beginPath(); ctx.moveTo(padding.left, y(pos.sl)); ctx.lineTo(w-padding.right, y(pos.sl)); ctx.stroke();
      // TP
      ctx.strokeStyle = CONFIG.colors.green;
      ctx.beginPath(); ctx.moveTo(padding.left, y(pos.tp)); ctx.lineTo(w-padding.right, y(pos.tp)); ctx.stroke();
      // Текущий P&L
      const lev = parseFloat($('leverage').value)||5;
      const curPnl = pos.dir==='LONG' ? (candles[lastIdx].close-pos.entry)/pos.entry*100*lev : (pos.entry-candles[lastIdx].close)/pos.entry*100*lev;
      ctx.fillStyle = curPnl>=0 ? CONFIG.colors.green : CONFIG.colors.red;
      ctx.font = `bold ${11*dpr}px sans-serif`;
      ctx.textAlign = 'left';
      ctx.fillText(`P&L: ${curPnl>=0?'+':''}${curPnl.toFixed(2)}%`, padding.left+5, y(candles[lastIdx].close)-10);
    }
  }
}

// ==================== ZOOM ====================
function initZoom() {
  const c = $('chart');
  if (!c) return;
  c.addEventListener('wheel', e => {
    e.preventDefault();
    const delta = e.deltaY > 0 ? 1.15 : 0.87;
    state.zoom.scale = Math.max(1, Math.min(20, state.zoom.scale * delta));
    drawChart();
  }, {passive:false});
  c.addEventListener('mousedown', e => {
    state.zoom.dragging = true;
    state.zoom.dragStartX = e.clientX;
    state.zoom.dragStartOffset = state.zoom.offset;
    c.style.cursor = 'grabbing';
  });
  window.addEventListener('mousemove', e => {
    if (!state.zoom.dragging) return;
    const rect = c.getBoundingClientRect();
    const dx = (e.clientX - state.zoom.dragStartX) / rect.width;
    state.zoom.offset = Math.max(0, Math.min(1, state.zoom.dragStartOffset - dx));
    drawChart();
  });
  window.addEventListener('mouseup', () => {
    state.zoom.dragging = false;
    if (c) c.style.cursor = 'crosshair';
  });
}
function resetZoom() {
  state.zoom.scale = 1;
  state.zoom.offset = 0;
  drawChart();
}

// ==================== UI ОБНОВЛЕНИЕ ====================
function updateUI() {
  const s = state.stats;
  const total = s.total;
  const wins = s.wins;
  const losses = s.losses;
  const wr = total>0 ? (wins/total*100).toFixed(1) : '0.0';
  $('totalTrades').textContent = total;
  $('winTrades').textContent = wins;
  $('lossTrades').textContent = losses;
  $('winRate').textContent = wr+'%';
  const pnlEl = $('sessionPnl');
  pnlEl.textContent = (s.pnl>=0?'+':'')+s.pnl.toFixed(2)+'%';
  pnlEl.className = 'pnl-live '+(s.pnl>=0?'pos':'neg');
  // Streak
  const sb = $('streakBox');
  sb.innerHTML = '';
  s.streak.slice(-12).forEach(r => {
    const d = document.createElement('div');
    d.className = 'streak-dot '+(r==='W'?'win':'loss');
    sb.appendChild(d);
  });
  // Статистика по стратегиям
  const stContainer = $('strategyStats');
  stContainer.innerHTML = '';
  for (const [name, st] of Object.entries(state.strategyStats)) {
    const stWr = st.trades>0 ? (st.wins/st.trades*100).toFixed(1) : '0.0';
    const card = document.createElement('div');
    card.className = 'strategy-card' + (st.trades>0?' active':'');
    card.innerHTML = `
      <div class="name">${name}</div>
      <div class="stats">
        <span>Сделок: ${st.trades}</span>
        <span class="pos">W: ${st.wins}</span>
        <span class="neg">L: ${st.losses}</span>
        <span>WR: ${stWr}%</span>
        <span class="${st.pnl>=0?'pos':'neg'}">P&L: ${st.pnl>=0?'+':''}${st.pnl.toFixed(2)}%</span>
      </div>
    `;
    stContainer.appendChild(card);
  }
  $('sessionBadge').textContent = state.running ? (state.mode==='turbo'?'🔥 TURBO АКТИВЕН':'⚖️ БОТ АКТИВЕН') : 'СЕССИЯ: ОЖИДАНИЕ';
  $('sessionBadge').style.background = state.running ? '#059669' : '#7c3aed';
}

// ==================== УПРАВЛЕНИЕ ====================
async function startBot() {
  if (state.running) return;
  state.symbol = $('symbol').value;
  state.mode = $('botMode').value;
  state.running = true;
  state.stats.sessionStart = Date.now();
  $('startBtn').style.display = 'none';
  $('stopBtn').style.display = 'block';
  $('stopBtn').disabled = false;
  $('dataBadge').textContent = 'РЕАЛЬНЫЕ ДАННЫЕ';
  $('dataBadge').className = 'badge badge-live';
  log('🚀 БОТ ЗАПУЩЕН | '+state.symbol+' | '+state.mode.toUpperCase());
  // Загрузка истории
  const tf = state.tf;
  const data = await fetchKlines(state.symbol, CONFIG.intervals[tf], CONFIG.limit);
  if (data) {
    state.candles[tf] = data;
    $('dataBadge').textContent = 'РЕАЛЬНЫЕ ДАННЫЕ';
    connectWS();
    drawChart();
    scan();
  } else {
    log('Данные недоступны, включён демо-режим','warn');
    $('dataBadge').textContent = 'ДЕМО';
    $('dataBadge').className = 'badge badge-demo';
    generateDemoData();
  }
}
function stopBot() {
  state.running = false;
  disconnectWS();
  $('startBtn').style.display = 'block';
  $('stopBtn').style.display = 'none';
  $('dataBadge').textContent = 'ОСТАНОВЛЕН';
  $('dataBadge').className = 'badge';
  $('dataBadge').style.background = '#475569';
  log('⏹ БОТ ОСТАНОВЛЕН');
  if (state.position) {
    const price = state.candles[state.tf] ? state.candles[state.tf][state.candles[state.tf].length-1].close : state.position.entry;
    closePosition('Ручная остановка', price);
  }
  updateUI();
}
function setTF(tf) {
  state.tf = tf;
  ['1m','5m','15m','1h'].forEach(t => {
    const btn = $('tf'+t);
    if (btn) btn.className = (t===tf?'active':'');
  });
  if (state.running) {
    disconnectWS();
    fetchKlines(state.symbol, CONFIG.intervals[tf], CONFIG.limit).then(data => {
      if (data) { state.candles[tf] = data; connectWS(); drawChart(); }
    });
  }
}
function generateDemoData() {
  const tf = state.tf;
  const arr = [];
  let price = state.symbol.includes('PAXG') ? 2600 : (state.symbol.includes('BTC')?65000:3500);
  const now = Date.now();
  for (let i=0;i<150;i++) {
    const t = now - (150-i)*getIntervalMs(tf);
    const change = (Math.random()-0.48)*price*0.008;
    const open = price;
    price += change;
    const high = Math.max(open, price) + Math.random()*price*0.003;
    const low = Math.min(open, price) - Math.random()*price*0.003;
    arr.push({ t, open, high, low, close: price, volume: Math.random()*100+50, quoteVolume: Math.random()*50000 });
  }
  state.candles[tf] = arr;
  drawChart();
}
function getIntervalMs(tf) {
  const map = {'1m':60000,'5m':300000,'15m':900000,'1h':3600000};
  return map[tf]||300000;
}

// ==================== ИНИЦИАЛИЗАЦИЯ ====================
document.addEventListener('DOMContentLoaded', () => {
  resizeCanvas();
  initZoom();
  updateUI();
  window.addEventListener('resize', resizeCanvas);
  // Часы
  setInterval(() => {
    const now = new Date();
    $('clock').textContent = now.toLocaleTimeString('ru-RU',{hour12:false}) + ' UTC';
  }, 1000);
  // Предзагрузка данных
  fetchKlines('PAXGUSDT','5m',100).then(data => {
    if (data) {
      state.candles['5m'] = data;
      $('dataBadge').textContent = 'РЕАЛЬНЫЕ ДАННЫЕ';
      $('dataBadge').className = 'badge badge-live';
      drawChart();
    }
  });
});
</script>
